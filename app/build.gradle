plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.vezel.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vezel.launcher'
        minSdk 23
        targetSdk 30
        versionCode 6
        versionName '1.2'
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks != null && new File(ks).exists()) {
                storeFile new File(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // fixed key when the secrets exist, otherwise the debug key so the build still installs
            signingConfig System.getenv('KEYSTORE_FILE') != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'org.mapsforge:mapsforge-core:0.20.0'
    implementation 'org.mapsforge:mapsforge-map:0.20.0'
    implementation 'org.mapsforge:mapsforge-map-reader:0.20.0'
    implementation 'org.mapsforge:mapsforge-themes:0.20.0'
    implementation 'org.mapsforge:mapsforge-map-android:0.20.0'
}
